<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GvYoutube's Addons</title>
  <meta name="description" content="GvYoutube's website" />
  <script>
    console.log("Hey! What are you doin' here!?")
  </script>
  <style>
    :root {
      --bg: #0b0d10;
      --card: #12161b;
      --text: #e8eef5;
      --muted: #a9b4c0;
      --accent: #6ea8fe;
      --ring: rgba(110, 168, 254, 0.35);
      --maxw: 760px;
      --radius: 16px;
      --gibberishdle-green-1: #7dff9b;
      --gibberishdle-green-2: #35d16f;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 80% -10%, rgba(110,168,254,0.15), transparent 45%), var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 24px;
    }

    .card {
      width: min(100%, var(--maxw));
      background: var(--card);
      border: 1px solid color-mix(in oklab, var(--muted) 22%, transparent);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.15),
        0 0 0 6px var(--ring);
    }

    .img-small {
      transform: scale(-50%);
      transform-origin: top left;
      display: inline-block;
      margin: 0;
    }

    .gif-big {
      transform: scale(60%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      max-width: 65ch;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-weight: 600;
      transition: 160ms ease;
    }

    .btn.primary {
      background: var(--accent);
      color: white;
    }

    a {
      color: white;
    }
    
    .btn.primary:hover { transform: translateY(-1px); opacity: 0.95; }

    .btn.ghost {
      border-color: color-mix(in oklab, var(--muted) 30%, transparent);
      color: var(--text);
      background: transparent;
    }

    .btn.ghost:hover {
      border-color: var(--muted);
      transform: translateY(-1px);
    }

    .btn.gibberishdle {
      background: linear-gradient(135deg, var(--gibberishdle-green-1), var(--gibberishdle-green-2));
      color: #05210f;
      border-color: color-mix(in oklab, var(--gibberishdle-green-2) 55%, black);
      box-shadow: 0 6px 16px rgba(53, 209, 111, 0.3);
    }

    .btn.gibberishdle:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    footer {
      margin-top: 26px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: color-mix(in oklab, var(--muted) 18%, transparent);
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      color: var(--text);
    }
  </style>

</head>
<body>
  <main class="card">
    <h1>GvYoutube's Firefox Addons</h1>
    <p>A list of my Firefox addons/themes I've made. If a link goes to a 404, Mozilla may not have approved it yet.</p></br>
    <a href="https://addons.mozilla.org/en-US/addon/tab-sounds-by-gvyt/">Tab Sounds</a></br>
    <a href="https://addons.mozilla.org/en-US/addon/gvyoutube-theme/">GvYoutube Theme (worst theme ever)</a></br>
    <footer>
      cool footer.
      copyright 2026 GvYoutube
    </footer>
  </main>
</body>
</html>
